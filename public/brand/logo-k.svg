<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Kall-UP">
  <defs>
    <!-- Court energy: navy → teal (sport, not clinical flat navy) -->
    <linearGradient id="pitch" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#003366"/>
      <stop offset="55%" stop-color="#003366"/>
      <stop offset="100%" stop-color="#339999"/>
    </linearGradient>
    <linearGradient id="kShine" x1="40" y1="28" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#6699ff"/>
    </linearGradient>
    <radialGradient id="ballGlow" cx="98" cy="98" r="22" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#cc3333" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#cc3333" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Ground -->
  <rect width="128" height="128" rx="28" fill="url(#pitch)"/>

  <!-- Dynamic call-up rays (gathering / convocatoria) -->
  <g stroke="#6699ff" stroke-width="2.5" stroke-linecap="round" opacity="0.85">
    <path d="M18 64 H38"/>
    <path d="M22 48 L36 56"/>
    <path d="M22 80 L36 72"/>
  </g>
  <g fill="#cc3333" opacity="0.9">
    <circle cx="16" cy="64" r="3.2"/>
    <circle cx="20" cy="46" r="2.4"/>
    <circle cx="20" cy="82" r="2.4"/>
  </g>

  <!-- Soft court frame -->
  <rect x="12" y="12" width="104" height="104" rx="20" fill="none" stroke="#6699ff" stroke-width="2.5" opacity="0.45"/>

  <!-- K mark -->
  <path
    fill="url(#kShine)"
    d="M38 26h20v30.5L84 26h24L70 64l40 38H86L58 72.5V102H38V26z"
  />

  <!-- Ball glow -->
  <circle cx="98" cy="98" r="22" fill="url(#ballGlow)"/>

  <!-- Ball (football / convocatoria cue) -->
  <g transform="translate(98 98)">
    <circle r="13" fill="#cc3333"/>
    <circle r="13" fill="none" stroke="#ffffff" stroke-width="1.4" opacity="0.9"/>
    <!-- Panel seams -->
    <path
      d="M0 -13 C-4 -4 -4 4 0 13 M0 -13 C4 -4 4 4 0 13 M-11 -5 C-2 -2 2 -2 11 -5 M-11 5 C-2 2 2 2 11 5"
      fill="none"
      stroke="#ffffff"
      stroke-width="1.35"
      stroke-linecap="round"
      opacity="0.95"
    />
    <!-- Center patch -->
    <circle r="2.6" fill="#ffffff"/>
  </g>

  <!-- Teal accent pip — motion / live -->
  <circle cx="108" cy="86" r="3.5" fill="#339999"/>
</svg>
